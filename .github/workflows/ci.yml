name: CI

# HomeStack has no hosted runner requirement beyond GitHub's own: the backend suite uses
# in-memory SQLite (see docs/08) and the browser suite is fully API-mocked (frontend/e2e/README),
# so neither job needs PostgreSQL or a live backend.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first; nothing here is a deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the production image is built from (backend/Dockerfile).
      # The host interpreter must never decide whether a release is green — Django 5.0.6 is
      # pinned in requirements.txt and a newer interpreter produces failures that say nothing
      # about the code.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check for unapplied model changes
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      # Deliberately serial. `--parallel` degrades failure reporting when a traceback cannot be
      # pickled back to the parent process, which turns a real failure into an unreadable one.
      # CI is the place that can afford the extra minute.
      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py test

  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc && vite build`, so this covers type checking too.
      - name: Type check and build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  version-manifest:
    name: Version manifest is in step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # versionHistory.json is generated and checksummed from VERSION_HISTORY.md, so editing
      # either by hand desynchronises the in-app version history without any other signal.
      - name: Check generated manifest matches VERSION_HISTORY.md
        run: python3 scripts/generate_version_manifest.py --check

      - name: Check APP_VERSION matches
        run: |
          set -euo pipefail
          declared="$(grep -oP "(?<=Current version: )[0-9]+\.[0-9]+\.[0-9]+" VERSION_HISTORY.md | head -1)"
          shipped="$(grep -oP "(?<=APP_VERSION = ')[0-9]+\.[0-9]+\.[0-9]+" frontend/src/config/version.ts)"
          echo "VERSION_HISTORY.md: $declared / version.ts: $shipped"
          test "$declared" = "$shipped"
