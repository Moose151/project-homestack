# HomeStack — production stack. This is what the live home server runs.
#
#   docker compose up -d --build          production (gunicorn + built React served by nginx)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build   development
#
# THREE services only: postgres, backend, frontend. LAN-trusted HTTPS is handled by the
# already-running Nginx Proxy Manager + Pi-hole outside this compose file (Security doc §13) —
# NPM routes /api/ to the backend and everything else to the frontend over Docker networking. No
# TLS terminates here.
# No Redis/Celery (D5).
#
# Production deliberately publishes no HomeStack app/database ports to the LAN. Use
# docker-compose.dev.yml when you need developer-friendly localhost/LAN ports.

services:
  homestack-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: homestack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - homestack_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  homestack-backend:
    build: ./backend
    container_name: homestack-backend
    env_file: .env
    environment:
      # Pinned here, not in .env, so a development value left in the live environment file cannot
      # silently put the production server back on development settings. The development override
      # sets it back to config.settings.dev.
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups
    expose:
      - "8000"
    networks:
      - homestack_private
      - npm_proxy
    depends_on:
      homestack-postgres:
        condition: service_healthy
    healthcheck:
      # No curl in python:slim; urllib is already there. prod settings always allow 127.0.0.1.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  homestack-frontend:
    build:
      context: ./frontend
      target: production
    container_name: homestack-frontend
    expose:
      - "5173"
    networks:
      - npm_proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - homestack-backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  backup_data:

networks:
  homestack_private:
    name: project-homestack_private
    internal: true
  npm_proxy:
    external: true
    name: ${NPM_DOCKER_NETWORK:-proxy}
