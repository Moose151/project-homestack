# HomeStack production frontend — serves the built Vite bundle from `dist/`.
#
# This is NOT a TLS terminator and NOT a second reverse proxy. Nginx Proxy Manager already holds
# the household certificate and routes /api/ straight to the backend; this server block only ever
# sees "everything else" and answers it with the React application
# (docs/02_Software_Architecture_Document.md §15).
#
# It listens on 5173 rather than 80 so the published host port and NPM's existing upstream are
# byte-for-byte unchanged by the move off the Vite dev server — production serving needs no
# Nginx Proxy Manager reconfiguration.

server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NPM logs the real client address; keep these on stdout/stderr for `docker logs`.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # Container health probe — deliberately not routed through the SPA fallback.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API is NPM's job, not this container's. Answering with a clear 404 rather than falling
    # through to index.html means a misrouted proxy shows up immediately as a missing endpoint,
    # instead of the SPA receiving HTML where it expected JSON. Reaching HomeStack on this port
    # directly is a development habit; the household always uses the HTTPS origin.
    location /api/ {
        access_log off;
        default_type application/json;
        return 404 "{\"detail\":\"The API is served by Nginx Proxy Manager at /api/, not by the frontend container.\"}";
    }

    # The service worker must never be cached, or a stale copy keeps handling push events after a
    # deploy. `no-cache` still allows a revalidated 304, so this costs one conditional request.
    location = /sw.js {
        include /etc/nginx/snippets/homestack-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # `types {}` empties the inherited MIME map for this location so default_type applies — the
    # stock map would otherwise serve this as application/json off the .json extension. Kept
    # short-lived so an icon/name change ships on redeploy.
    location = /manifest.json {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/homestack-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames here, so these are safe to cache indefinitely — a new
    # build produces new names rather than new contents at the same name.
    location /assets/ {
        include /etc/nginx/snippets/homestack-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Brand assets (PWA icons, notification badge) are referenced by fixed, unhashed names from
    # index.html, the manifest and the service worker, so they get a day rather than a year.
    location /brand/ {
        include /etc/nginx/snippets/homestack-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # React Router owns the URL space: /calendar, /books, /settings/notifications, /homestead/...
    # all have to return the application on a cold load or refresh, not 404. index.html itself is
    # never cached, so a deploy is picked up on the next navigation.
    location / {
        include /etc/nginx/snippets/homestack-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
