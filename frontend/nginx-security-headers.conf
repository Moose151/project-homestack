# Included into every location that sets any header of its own.
#
# nginx's add_header directives are inherited from the enclosing block ONLY when the current
# block defines none. Because each location below sets its own Cache-Control, a server-level
# copy of these would be silently dropped exactly where it matters, so they are included
# explicitly instead.
#
# No Content-Security-Policy yet: it has to be authored against the real bundle and verified in
# a browser, which is its own change (docs/34_Recommended_Next_Steps.md).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
